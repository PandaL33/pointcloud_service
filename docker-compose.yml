version: '3.8'

services:
  pointcloud-service:
    build: .
    ports:
      - "10080:10080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - FILE_SERVER_URL=http://host.docker.internal:10103
    restart: unless-stopped
    networks:
      - pointcloud-network

networks:
  pointcloud-network:
    driver: bridge